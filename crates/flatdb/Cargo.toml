[package]
name = "rustock-flatdb"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Without this the workspace's `allow`s do not reach this crate, and CI's
# `clippy -D warnings` fails on a lint every sibling is excused from.
[lints]
workspace = true

[dependencies]
memmap2 = "0.9"
crc32fast = "1"
sha3 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# `fallocate`, which only Unix has; Windows reserves a segment with `set_len`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1"
